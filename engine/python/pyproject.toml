[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensors"
version = "0.1.0"
description = "Typed Python sensor adapters for the Rust DJ kernel (IPC boundary)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8.2",
  "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["sensors"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["sensors", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
