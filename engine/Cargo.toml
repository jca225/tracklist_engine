[workspace]
resolver = "2"
members = [
    "crates/dj_kernel",
    "crates/dj_migrate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["alignment_algorithm"]

[workspace.dependencies]
dj_kernel = { path = "crates/dj_kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"
indexmap = { version = "2", features = ["serde"] }
